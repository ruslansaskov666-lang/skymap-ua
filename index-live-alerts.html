<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>SkyMap UA</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;color:#111827}
header{background:#111827;color:#fff;padding:16px 16px 14px;position:sticky;top:0;z-index:1000}
h1{font-size:24px;margin:0}.sub{font-size:13px;color:#cbd5e1;margin-top:3px}.online{font-size:12px;margin-top:7px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;margin-right:6px}
#map{height:48vh;min-height:320px}.panel{padding:12px 12px 90px}.bar{background:#fff;border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 2px 10px #00000010}
.title{font-weight:700}.muted{font-size:12px;color:#6b7280;margin-top:3px}
.region{display:flex;align-items:center;justify-content:space-between;padding:13px 10px;border-top:1px solid #e5e7eb}.region:first-child{border-top:0}
.name{font-weight:600}.status{font-size:13px;font-weight:700;padding:7px 10px;border-radius:10px}
.calm{background:#dcfce7;color:#166534}.partial{background:#fef3c7;color:#92400e}.alert{background:#fee2e2;color:#991b1b}.unknown{background:#e5e7eb;color:#374151}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;z-index:2000;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:11px 4px 9px;font-size:12px;color:#6b7280}nav button.active{color:#111827;font-weight:700}
.smallbtn{border:0;border-radius:10px;background:#111827;color:#fff;padding:9px 12px;font-weight:600}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.hidden{display:none}
.leaflet-popup-content{font-size:14px}
</style>
</head>
<body>
<header>
  <h1>SkyMap UA</h1>
  <div class="sub">Цивільна карта повітряних тривог</div>
  <div class="online"><span class="dot"></span><span id="connection">Підключення...</span></div>
</header>

<div id="map"></div>

<main class="panel">
  <section class="bar">
    <div class="row">
      <div><div class="title">Стан тривог</div><div class="muted" id="updated">Очікування даних…</div></div>
      <button class="smallbtn" id="refresh">Оновити</button>
    </div>
  </section>

  <section class="bar">
    <div class="title">Області</div>
    <div id="regions"></div>
  </section>

  <section class="bar">
    <div class="muted">
      Дані показують лише цивільний статус повітряної тривоги по регіонах.
      Військові цілі, точні координати та маршрути не відображаються.
    </div>
  </section>
</main>

<nav>
  <button class="active" data-tab="map">🗺️<br>Карта</button>
  <button data-tab="alerts">🚨<br>Тривоги</button>
  <button data-tab="stats">📊<br>Статистика</button>
  <button data-tab="settings">⚙️<br>Налаштування</button>
</nav>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// Після створення Cloudflare Worker встав сюди його URL.
// Наприклад: https://skymap-alerts.ТВОЄ.workers.dev
const API_BASE = "https://rapid-snowflake-95a2.ruslansaskov666.workers.dev";

const regions = [
 ["АР Крим",45.1,34.2],["Волинська",50.75,25.35],["Вінницька",49.2,28.5],
 ["Дніпропетровська",48.5,35.0],["Донецька",48.0,37.8],["Житомирська",50.6,28.7],
 ["Закарпатська",48.4,23.2],["Запорізька",47.8,35.2],["Івано-Франківська",48.7,24.6],
 ["м. Київ",50.45,30.52],["Київська",50.8,30.0],["Кіровоградська",48.5,32.3],
 ["Луганська",48.6,39.2],["Львівська",49.8,24.0],["Миколаївська",47.0,32.0],
 ["Одеська",46.5,30.7],["Полтавська",49.6,34.5],["Рівненська",50.6,26.25],
 ["Севастополь",44.6,33.5],["Сумська",51.0,34.8],["Тернопільська",49.55,25.6],
 ["Харківська",49.99,36.23],["Херсонська",46.6,32.6],["Хмельницька",49.4,27.0],
 ["Черкаська",49.0,31.9],["Чернівецька",48.3,25.9],["Чернігівська",51.0,31.3]
];

const map=L.map("map").setView([49.0,31.2],6);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap contributors"}).addTo(map);
const markers={};

function statusInfo(s){
  if(s==="A") return ["ТРИВОГА","alert"];
  if(s==="P") return ["Часткова тривога","partial"];
  if(s==="N") return ["Немає даних","unknown"];
  return ["Немає даних","unknown"];
}
function markerColor(s){
  if(s==="A") return "#dc2626";
  if(s==="P") return "#f59e0b";
  if(s==="N") return "#6b7280";
  return "#6b7280";
}
function render(data){
  const statuses=data.statuses||{};
  const box=document.getElementById("regions"); box.innerHTML="";
  regions.forEach(([name,lat,lng],i)=>{
    const s=statuses[String(i)]||"N";
    const [label,cls]=statusInfo(s);
    const div=document.createElement("div"); div.className="region";
    div.innerHTML=`<span class="name">${name}</span><span class="status ${cls}">${label}</span>`;
    box.appendChild(div);
    if(markers[i]) markers[i].remove();
    const m=L.circleMarker([lat,lng],{radius:9,color:"#fff",weight:2,fillColor:markerColor(s),fillOpacity:.9}).addTo(map);
    m.bindPopup(`<b>${name}</b><br>${label}`);
    markers[i]=m;
  });
  document.getElementById("updated").textContent="Оновлено: "+new Date().toLocaleTimeString("uk-UA");
  document.getElementById("connection").textContent="Система онлайн";
}
async function load(){
  if(API_BASE.includes("PASTE_")) {
    render({statuses:{}});
    document.getElementById("connection").textContent="Демо-режим";
    document.getElementById("updated").textContent="Потрібно підключити сервер";
    return;
  }
  try{
    const r=await fetch(API_BASE.replace(/\/$/,"")+"/api/alerts",{cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const data=await r.json(); render(data);
  }catch(e){
    document.getElementById("connection").textContent="Помилка підключення";
  }
}
document.getElementById("refresh").onclick=load;
setInterval(load,60000);
load();

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  if(b.dataset.tab==="map") document.getElementById("map").scrollIntoView({behavior:"smooth"});
  if(b.dataset.tab==="alerts") document.querySelector(".panel").scrollIntoView({behavior:"smooth"});
  if(b.dataset.tab==="stats") alert("Статистика буде додана наступним оновленням.");
  if(b.dataset.tab==="settings") alert("Автооновлення: кожні 60 секунд.");
});
</script>
</body>
</html>
