<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkyMap UA</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f2f4f7;
  color:#111827;
}
header{
  background:#0b1020;
  color:white;
  padding:18px 16px 14px;
}
h1{margin:0;font-size:28px}
.sub{margin-top:5px;color:#cbd5e1}
.online{margin-top:12px}
.dot{
  display:inline-block;
  width:10px;
  height:10px;
  background:#22c55e;
  border-radius:50%;
  margin-right:8px;
}
#map{
  height:52vh;
  min-height:350px;
}
.card{
  background:white;
  margin:12px;
  padding:16px;
  border-radius:18px;
  box-shadow:0 2px 10px #0001;
}
.card h2{
  margin:0 0 8px;
  font-size:21px;
}
.updated{
  color:#64748b;
  font-size:14px;
}
.region{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:13px 0;
  border-bottom:1px solid #e5e7eb;
}
.region:last-child{border-bottom:0}
.badge{
  padding:7px 11px;
  border-radius:12px;
  font-weight:700;
}
.alert{background:#fee2e2;color:#991b1b}
.partial{background:#fef3c7;color:#92400e}
.calm{background:#dcfce7;color:#166534}
.unknown{background:#e5e7eb;color:#475569}
button{
  border:0;
  border-radius:12px;
  padding:11px 15px;
  background:#111827;
  color:white;
  font-size:16px;
}
nav{
  position:sticky;
  bottom:0;
  display:flex;
  background:white;
  border-top:1px solid #ddd;
}
nav button{
  flex:1;
  background:white;
  color:#334155;
  border-radius:0;
  padding:12px 4px;
  font-size:13px;
}
</style>
</head>

<body>

<header>
  <h1>SkyMap UA</h1>
  <div class="sub">Цивільна карта повітряних тривог</div>
  <div class="online">
    <span class="dot"></span>Система онлайн
  </div>
</header>

<div id="map"></div>

<div class="card">
  <h2>Стан тривог</h2>
  <div class="updated" id="updated">Завантаження...</div>
  <br>
  <button onclick="loadAlerts()">Оновити</button>
</div>

<div class="card">
  <h2>Області</h2>
  <div id="regions">Завантаження...</div>
</div>

<nav>
  <button>🗺️<br>Карта</button>
  <button>🚨<br>Тривоги</button>
  <button>📊<br>Статистика</button>
  <button>⚙️<br>Налаштування</button>
</nav>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const API_BASE =
  "https://rapid-snowflake-95a2.ruslansaskov666.workers.dev";

const regions = [
  "АР Крим",
  "Вінницька",
  "Волинська",
  "Дніпропетровська",
  "Донецька",
  "Житомирська",
  "Закарпатська",
  "Запорізька",
  "Івано-Франківська",
  "Київська",
  "Кіровоградська",
  "Луганська",
  "Львівська",
  "Миколаївська",
  "Одеська",
  "Полтавська",
  "Рівненська",
  "Сумська",
  "Тернопільська",
  "Харківська",
  "Херсонська",
  "Хмельницька",
  "Черкаська",
  "Чернівецька",
  "Чернігівська",
  "Київ"
];

const map = L.map("map").setView([49.0,31.0],6);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    attribution:"© OpenStreetMap contributors"
  }
).addTo(map);

function statusInfo(code){
  if(code==="A"){
    return ["ТРИВОГА","alert"];
  }
  if(code==="P"){
    return ["ЧАСТКОВА","partial"];
  }
  if(code==="N"){
    return ["НЕМАЄ ДАНИХ","unknown"];
  }
  return ["ВІДБІЙ","calm"];
}

async function loadAlerts(){
  const box=document.getElementById("regions");
  box.innerHTML="Завантаження...";

  try{
    const response=await fetch(API_BASE+"/api/alerts");

    if(!response.ok){
      throw new Error("API "+response.status);
    }

    const data=await response.json();

    let html="";

    regions.forEach((name,i)=>{
      const code=data.statuses[String(i)] || "N";
      const info=statusInfo(code);

      html+=`
        <div class="region">
          <b>${name}</b>
          <span class="badge ${info[1]}">${info[0]}</span>
        </div>
      `;
    });

    box.innerHTML=html;

    const time=new Date(data.updated_at);

    document.getElementById("updated").textContent=
      "Оновлено: "+time.toLocaleString("uk-UA");

  }catch(error){

    box.innerHTML=
      '<div class="badge unknown">Не вдалося отримати дані</div>';

    document.getElementById("updated").textContent=
      "Помилка з'єднання з сервером";
  }
}

loadAlerts();

setInterval(loadAlerts,60000);
</script>

</body>
</html>
